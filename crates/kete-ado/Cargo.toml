[package]
name = "kete-ado"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kete's Azure DevOps client: remotes, tokens (GCM, az), the REST client, ado.json, tasks, branches and pull requests; shared by the desktop window and the `kete ado` CLI (no UI dependencies)"

[features]
# For dependents' test builds: a fixed-credential token source, the fake
# credential runner and a context over a mock server.
test-support = []

[dependencies]
nebula-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "io-util", "process"] }
base64 = "0.22"
async-trait = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
httpmock = "0.7"
tempfile = { workspace = true }
