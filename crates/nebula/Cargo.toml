[package]
name = "nebula"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "kete"
path = "src/main.rs"

# The old name, still installed: the same program (src/bro.rs includes
# src/main.rs), and usage lines say `bro` when it is run as `bro`.
[[bin]]
name = "bro"
path = "src/bro.rs"

[dependencies]
nebula-core = { workspace = true }
nebula-daemon = { workspace = true }
nebula-tui = { workspace = true }
nebula-config = { workspace = true }
kete-ado = { workspace = true }
anyhow = { workspace = true }
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
clap = { version = "4", features = ["derive", "wrap_help"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
kete-ado = { workspace = true, features = ["test-support"] }
httpmock = "0.7"
portable-pty = { workspace = true }
vt100 = { workspace = true }

# The Windows end-to-end suite reads its fake agent's console raw.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

# The Windows end-to-end suite runs its own main: the same binary is the
# fake agent the daemon launches in a session (see tests/e2e_windows).
[[test]]
name = "e2e_windows"
path = "tests/e2e_windows/main.rs"
harness = false

# The app icon in kete.exe's (and bro.exe's) resources, so Explorer, the
# taskbar and Windows Terminal profiles show the kete mark.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
