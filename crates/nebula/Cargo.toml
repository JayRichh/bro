[package]
name = "nebula"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "kete"
path = "src/main.rs"

# The old name, still installed: the same program (src/bro.rs includes
# src/main.rs), and usage lines say `bro` when it is run as `bro`.
[[bin]]
name = "bro"
path = "src/bro.rs"

[dependencies]
nebula-core = { workspace = true }
nebula-daemon = { workspace = true }
nebula-tui = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive", "wrap_help"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
serde_json = { workspace = true }
portable-pty = { workspace = true }
vt100 = { workspace = true }

# The app icon in kete.exe's (and bro.exe's) resources, so Explorer, the
# taskbar and Windows Terminal profiles show the kete mark.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
