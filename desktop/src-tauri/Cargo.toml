[package]
name = "kete-desktop"
version = "0.44.0"
edition = "2021"
license = "MIT"
description = "Kete's desktop window: the board, live sessions and diffs over the Kete daemon"

[[bin]]
name = "kete-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nebula-core = { path = "../../crates/nebula-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "process"] }
anyhow = "1"
base64 = "0.22"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
httpmock = "0.7"
