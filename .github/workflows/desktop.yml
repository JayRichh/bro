name: Desktop

# The Tauri GUI in desktop/ is its own Cargo workspace, kept out of the root
# one so the core CI never compiles Tauri. This job builds it when it, or
# the nebula-core protocol it speaks, changes.
on:
  pull_request:
    paths:
      - "desktop/**"
      - "crates/nebula-core/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main, windows]
    paths:
      - "desktop/**"
      - "crates/nebula-core/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  build:
    name: bro-desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    env:
      CARGO_TERM_COLOR: always

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install WebKitGTK and friends
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Cache cargo and target directories
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1
        with:
          workspaces: desktop -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check the frontend
        run: npm run check

      - name: Build bro-desktop
        run: npm run tauri build

      - name: Check clippy
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Test the backend
        run: cargo test --release --locked

      - name: Upload bro-desktop.exe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: bro-desktop-windows-x64
          path: desktop/target/release/bro-desktop.exe
          if-no-files-found: error
