name: Release

on:
  push:
    tags: ["v*"]
  # Dry run: build the whole matrix on demand without publishing anything, so
  # a cross-compile break is caught before a tag is cut (the release job below
  # only runs for a tag push).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # kete, and bro (its old name) as a copy of the same binary, so the two
      # commands are byte for byte one program. Windows also ships kete-w.exe,
      # kete with no console window, which the wake-up's scheduled task runs.
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/kete target/${{ matrix.target }}/release/bro
          tar -czf kete-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release kete bro

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "target/${{ matrix.target }}/release"
          Copy-Item "$dir/kete.exe" "$dir/bro.exe" -Force
          Compress-Archive -Path "$dir/kete.exe", "$dir/bro.exe", "$dir/kete-w.exe" -DestinationPath kete-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: kete-${{ matrix.target }}
          path: |
            kete-${{ matrix.target }}.tar.gz
            kete-${{ matrix.target }}.zip
          if-no-files-found: error

  # The desktop window as a per-user NSIS installer (no admin prompt). It
  # isn't code signed, so SmartScreen may warn the first time it runs.
  # desktop/ is its own Cargo workspace, so the bundle lands in desktop/target.
  desktop-windows:
    name: kete-desktop (windows installer)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the installer
        run: npm run tauri build

      - name: Name the installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis -Filter 'Kete_*_x64-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw "no Kete_*_x64-setup.exe in target/release/bundle/nsis" }
          Copy-Item $setup.FullName ../kete-desktop-x86_64-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: kete-desktop-x86_64-setup
          path: kete-desktop-x86_64-setup.exe
          if-no-files-found: error

  release:
    needs: [build, desktop-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            kete-*.tar.gz
            kete-*.zip
            kete-desktop-x86_64-setup.exe
          generate_release_notes: true
