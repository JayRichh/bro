name: Release

on:
  push:
    tags: ["v*"]
  # Dry run: build the whole matrix on demand without publishing anything, so
  # a cross-compile break is caught before a tag is cut (the release job below
  # only runs for a tag push).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # kete, and bro (its old name) as a copy of the same binary, so the two
      # commands are byte for byte one program.
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/kete target/${{ matrix.target }}/release/bro
          tar -czf kete-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release kete bro

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "target/${{ matrix.target }}/release"
          Copy-Item "$dir/kete.exe" "$dir/bro.exe" -Force
          Compress-Archive -Path "$dir/kete.exe", "$dir/bro.exe" -DestinationPath kete-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: kete-${{ matrix.target }}
          path: |
            kete-${{ matrix.target }}.tar.gz
            kete-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            kete-*.tar.gz
            kete-*.zip
          generate_release_notes: true
